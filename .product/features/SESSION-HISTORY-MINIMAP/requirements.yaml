baseline: 1
actors:
  - session user
requirements:
  R1:
    statement: The minimap lists every user input on the active branch, including inputs before compaction.
    priority: must
  R2:
    statement: Initial session loading must not fetch or render full historical assistant/tool payloads.
    priority: must
  R3:
    statement: Selecting an unloaded minimap input loads and scrolls to that input.
    priority: must
  R4:
    statement: Branch semantics and stored session history remain authoritative.
    priority: must
version: 1
feature: SESSION-HISTORY-MINIMAP
