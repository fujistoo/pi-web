  - title: Host the live office in the session-level Agents panel
    evidence:
      - User-provided screenshot shows the intended top-toolbar Agents tab and dropdown.
      - >-
        components/AppShell.tsx routes the activeTopPanel "agents" state to AgentSessionPanel and its Open workspace
        action to AgentWorkspace.
      - components/SettingsPanel.tsx separately uses Settings → Agents for profile/configuration.
    decision: >-
      The Pixel Agents office is a read-only view reached from the existing session-level Agents top-toolbar panel shown
      in the screenshot. It may augment or replace the current agent workspace after Milestone 0 inspects the renderer
      boundary, but it must not be placed in Settings → Agents.
    rationale: >-
      This uses the existing agent-family entry point, preserves current configuration semantics, and keeps the
      animation view in the context where live subagents are already shown.
    clarificationId: CLAR-001
    affectedRequirements:
      - R2
      - R3
      - R5
    id: DEC-001
    status: accepted
    recorded_at: '2026-09-12T13:39:23.766Z'
