  - id: DEC-003
    title: Place visual mockups in Previews, not Agents
    decision: >-
      Keep the live read-only Pixel Agents office and real agent chats in the session-level Agents workspace. Move all
      character-styling/design-study mockups to pi-web's existing side-panel Previews surface. Agents must not contain a
      Mockups tab.
    rationale: >-
      Agents is for observing real Pi execution and child-session chats; mockups are exploratory design artifacts and
      belong in the established preview surface. This preserves the separation between live runtime status and
      speculative visual exploration.
    evidence:
      - 'User clarification: "lets ensure that mockups go into previews not within agents."'
      - >-
        components/AgentWorkspace.tsx currently renders a Mockups tab and PixelAgentsMockups inside the Agents
        workspace.
      - AppShell.tsx already owns the side-panel preview surface through LivePreviewPanel.
    affectedRequirements:
      - R2
      - R3
      - R5
    status: accepted
    recorded_at: '2026-09-12T17:11:21.545Z'
    version: 1
    feature: PI-PIXEL-AGENTS
  - id: DEC-004
    title: Scope the embedded office to the selected session family
    decision: >-
      The pi-web embedded Pixel Agents office must display only live child agents descended from the selected session
      root. It must not display root agents from other pi-web sessions or the selected parent agent itself, so an Agents
      panel showing zero sub-agents also shows an empty office. Direct standalone Pixel Agents URLs remain global unless
      a scope is explicitly supplied.
    rationale: >-
      The existing Agents workspace is session-level and counts child sessions, while the standalone server state is
      project-global and persisted. Scoping the read-only embedded connection aligns the office with the panel's session
      context without changing Pi execution or direct Pixel Agents behavior.
    evidence:
      - >-
        Current pi-web UI showed 0 sub-agents while ~/.pixel-agents/standalone-state.json contained four external root
        Pi sessions for the project.
      - Requirements R2 and R5 require a session-level observational workspace.
      - >-
        components/AgentWorkspace.tsx currently receives the selected session family but PixelAgentsOffice did not pass
        that identity to the standalone server.
    affectedRequirements:
      - R2
      - R5
    status: accepted
    version: 1
    recorded_at: '2026-09-13T04:10:41.949Z'
    feature: PI-PIXEL-AGENTS
  - title: Agents workspace is a toolbar-toggleable surface
    decision: >-
      Expose the Agents workspace as a direct toolbar toggle in addition to the existing Agents session switcher. It
      remains available when no agents are spawned and may show its empty Pixel Agents state.
    rationale: The workspace is a primary surface and should be discoverable without opening the session switcher first.
    status: accepted
