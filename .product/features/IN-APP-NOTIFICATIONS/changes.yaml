    summary: >-
      Removed manual Add preview and Archive preview controls. Preview tabs now open from `/preview/<name>.html` output
      references or generated preview-file chips, use the referenced filename, delete their runtime artifact when
      closed, and retain TTL cleanup for abandoned artifacts.
    reason: PO/PM clarification removed the Add preview and Archive preview controls.
    requirements:
      - Preview tabs are discovered from `/preview/<name>.html` references in agent output or generated-file chips.
      - Preview tab labels use the referenced filename.
      - Closing a preview deletes its runtime artifact immediately.
      - Untouched `.pi/previews/*.html` artifacts remain subject to TTL garbage collection.
